name: Podcast Diário

on:
  schedule:
    # A cada 2 horas, somente durante o dia.
    #
    # Horários de Brasília:
    # 08:07
    # 10:07
    # 12:07
    # 14:07
    # 16:07
    # 18:07
    # 20:07
    # 22:07

    - cron: "7 8,10,12,14,16,18,20,22 * * *"
      timezone: "America/Sao_Paulo"

  # Permite executar manualmente
  workflow_dispatch:


permissions:
  contents: write


# Impede duas execuções simultâneas.
# Fundamental porque usamos
# podcast_state.json.
concurrency:

  group: podcast-diario

  cancel-in-progress: false


jobs:

  gerar-e-enviar:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ==========================================
      # REPOSITÓRIO
      # ==========================================

      - name: Checkout do repositório

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================================
      # FFMPEG
      #
      # Necessário para juntar as falas
      # dos dois apresentadores.
      # ==========================================

      - name: Instalar FFmpeg

        run: |

          sudo apt-get update -qq

          sudo apt-get install -y ffmpeg

          ffmpeg -version


      # ==========================================
      # DEPENDÊNCIAS PYTHON
      # ==========================================

      - name: Instalar dependências

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================
      # GERAR PODCAST
      # ==========================================

      - name: Gerar podcast com dois apresentadores

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python generate_podcast.py


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commitar episódio e estado

        uses: stefanzweifel/git-auto-commit-action@v5

        with:

          commit_message: "🎙️ Novo podcast com dois apresentadores"

          file_pattern: "episodes/** podcast_state.json"