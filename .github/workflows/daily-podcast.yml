name: Podcast Diário

on:
  schedule:
    # Executa uma vez por hora.
    # Sempre no minuto 7.
    #
    # Exemplos:
    # 08:07
    # 09:07
    # 10:07
    # 11:07
    # etc.
    # A cada 2 horas, somente entre 08:00 e 22:00
    - cron: "7 8,10,12,14,16,18,20,22 * * *"
        timezone: "America/Sao_Paulo"
  # Permite executar manualmente
  workflow_dispatch:

permissions:
  contents: write


# Impede duas execuções simultâneas.
# Isso é importante porque usamos
# podcast_state.json para controlar
# qual será o próximo tema.
concurrency:

  group: podcast-diario

  cancel-in-progress: false


jobs:

  gerar-e-enviar:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Checkout do repositório

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================================
      # DEPENDÊNCIAS
      # ==========================================

      - name: Instalar dependências

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================
      # GERAR PODCAST
      # ==========================================

      - name: Gerar podcast e enviar para Telegram

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python generate_podcast.py


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commitar episódio e estado

        uses: stefanzweifel/git-auto-commit-action@v5

        with:

          commit_message: "🎙️ Novo episódio automático"

          file_pattern: "episodes/** podcast_state.json"