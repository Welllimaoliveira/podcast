name: Podcast Diário

on:
  schedule:
    # TESTE: executa a cada 5 minutos
    - cron: "*/5 * * * *"

  # Permite executar manualmente
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar podcast e enviar para o Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_podcast.py

      - name: Commitar episódio gerado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎙️ Episódio automático do dia"
          file_pattern: "episodes/**"
